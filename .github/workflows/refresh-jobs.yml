name: Refresh EzyJobs data

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Refresh free job sources
        run: npm run ingest
      - name: Refresh search demand intelligence
        run: npm run keyword-intelligence
      - name: Refresh sitemap
        run: npm run sitemap
      - name: Commit refreshed snapshot
        run: |
          git config user.name "ezyjobs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/liveJobs.ts public/jobs.json public/keyword-intelligence.json src/data/keywordIntelligence.ts public/sitemap.xml
          if git diff --cached --quiet; then
            echo "No job data changes."
            exit 0
          fi
          git commit -m "chore: refresh job snapshot"
          git push
